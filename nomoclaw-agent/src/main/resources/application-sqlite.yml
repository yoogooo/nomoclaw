spring:
  datasource:
    url: "${SQLITE_URL:jdbc:sqlite:${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}/data/nomoclaw.db}"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  flyway:
    # SQLite schema is initialized atomically from the shared schema and migrations.
    # Flyway does not currently provide a SQLite database module in this distribution.
    enabled: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      "org.quartz.jobStore.driverDelegateClass": org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      "org.quartz.jobStore.selectWithLockSQL": "SELECT * FROM {0}LOCKS WHERE SCHED_NAME = {1} AND LOCK_NAME = ?"
