spring:
  application:
    name: bot
  servlet:
    multipart:
      max-file-size: "${knowledge.upload.max-file-size:100MB}"
      max-request-size: 200MB
  mvc:
    async:
      request-timeout: -1
  profiles:
    default: local
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: false
    properties:
      "org.quartz.scheduler.instanceName": NomoClawScheduler
      "org.quartz.scheduler.instanceId": AUTO
      "org.quartz.jobStore.isClustered": false
      "org.quartz.jobStore.misfireThreshold": 60000
      "org.quartz.threadPool.threadCount": 3
    # initialize-schema can be enabled with:
    # spring:
    #   sql:
    #     init:
    #       mode: always
    #       schema-locations: classpath:db/schema-mysql.sql

mybatis-plus:
  global-config:
    banner: false

server:
  address: 127.0.0.1
  tomcat:
    threads:
      min-spare: 2
      max: 20

agent:
  command:
    timeout-seconds: 60
  browser:
    step-timeout-seconds: 10
    click-timeout-seconds: 10
    mode: auto
    headless: true
    force-click-fallback-enabled: false
    shared-profile-enabled: true
    shared-profile-name: shared
    local-bridge:
      cdp-endpoint: "http://localhost:9222"
      local-bridge-domains:
        - "xiaohongshu.com"
        - "google.com"
        - "*.google.com"
      connect-timeout-ms: 10000
      fallback-to-managed: false
      consent-required: false
  retry:
    max-attempts: 2
  loop:
    max-rounds: 200
  approval:
    high-risk-enabled: true
  api:
    local-only-enabled: true
    chat-upload:
      max-file-size: 10MB
      max-request-size: 100MB
  web-search:
    endpoints:
      - "https://www.bing.com/search?q={query}&setlang=zh-Hans"

nomoclaw:
  root-dir: "${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}"
  cron:
    approval-timeout-seconds: 1800
    resume-interval-seconds: 3
    resume-batch-size: 100
  flyway:
    fail-on-migrate-error: false

llm:
  provider: dashscope
  timeout: 180s
  max-retries: 2
  debug:
    enabled: true
    file-path: "logs/llm-debug.jsonl"
    max-chars-per-field: 200000
    redact-enabled: true
    include-response-text: true
    max-file-size-bytes: 52428800
  codex:
    model-name: gpt-5.4
    instructions: "You are a task planner and execution assistant."
  ollama:
    base-url: "http://localhost:11434"
    model-name: qwen3:8b
  qwen:
    api-key: "${DASHSCOPE_API_KEY:}"
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model-name: qwen3.5-plus
  gemini:
    api-key: "${GEMINI_API_KEY:}"
    base-url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model-name: gemini-2.5-flash
  kimi:
    api-key: "${KIMI_API_KEY:}"
    base-url: "https://api.moonshot.cn/v1"
    model-name: kimi-latest
  minimax:
    api-key: "${MINIMAX_API_KEY:}"
    base-url: "https://api.minimaxi.com/v1"
    model-name: MiniMax-M2.7
  model-config:
    encryption-key: "${LLM_MODEL_CONFIG_ENCRYPTION_KEY:}"
  model-catalog:
    remote-url: "${LLM_MODEL_CATALOG_REMOTE_URL:}"

logging:
  level:
    "ai.nomoclaw.bot": INFO

knowledge:
  enabled: true
  storage-root: "${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}/knowledge"
  upload:
    max-file-size: 100MB
    max-request-size: 200MB
    max-files-per-request: 20
  ingestion:
    worker-count: 2
    lease-seconds: 300
    dispatch-interval: 1s
    initial-retry-delay: 5s
    max-retry-delay: 5m
    max-attempts: 3
    embedding-batch-size: 32
  chunking:
    default-size-tokens: 1000
    default-overlap-tokens: 160
  parsing:
    pdf:
      preprocessing:
        max-header-lines: 2
        max-footer-lines: 2
        watermark-repeated-threshold-ratio: 0.5
        watermark-center-region-ratio: 0.65
        watermark-min-text-length: 2
        watermark-max-text-length: 80
        watermark-rotation-threshold-degrees: 10
        watermark-min-font-size: 18
        watermark-normalize-spacing: true
        header-lines: []
        footer-lines: []
        watermark-lines: []
        standalone-list-marker-patterns:
          - '^(?:\d+|[一二三四五六七八九十]+)[.)．、]$'
          - '^[（(][一二三四五六七八九十\d]+[）)]$'
  embedding-cache:
    enabled: true
    max-entries: 100000
    ttl: 30d
    cleanup-interval: 1h
  retrieval:
    default-top-k: 8
    max-context-tokens: 6000
    default-similarity-threshold: 0.35
    max-chunks-per-document: 3
    bm25:
      enabled: true
      backend: elasticsearch
      index-path: "${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}/knowledge/bm25"
      startup-rebuild-enabled: false
      candidate-limit: 40
      rrf-k: 60
      elasticsearch:
        url: "${ELASTICSEARCH_URL:http://127.0.0.1:9200}"
        api-key: "${ELASTICSEARCH_API_KEY:}"
        timeout: 10s
        index-name: "${ELASTICSEARCH_BM25_INDEX:nomoclaw_knowledge_bm25}"
    rerank:
      enabled: true
      warmup-enabled: false
      provider: onnx
      model-path: "${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}/models/bge-reranker-v2-m3/onnx/model_int8.onnx"
      tokenizer-path: "${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}/models/bge-reranker-v2-m3/tokenizer.json"
      candidate-limit: 50
      timeout: 15s
  vector:
    qdrant:
      url: "${QDRANT_URL:http://127.0.0.1:6333}"
      api-key: "${QDRANT_API_KEY:}"
      timeout: 10s
