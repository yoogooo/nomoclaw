name: release-desktop-multi-platform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos-x64
          - macos-arm64
      version:
        description: "Desktop version (x.y.z), e.g. 1.2.3"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.id }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runs_on: windows-latest
            target_filter: windows
            run_script: ./scripts/build-desktop-windows-x64.sh
            artifact_paths: |
              desktop/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              desktop/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - id: macos-x64
            runs_on: macos-13
            target_filter: macos-x64
            run_script: ./scripts/build-desktop-macos.sh
            target_arch: x64
            artifact_paths: |
              desktop/tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              desktop/tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.sig
              desktop/tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/latest.json
          - id: macos-arm64
            runs_on: macos-14
            target_filter: macos-arm64
            run_script: ./scripts/build-desktop-macos.sh
            target_arch: arm64
            artifact_paths: |
              desktop/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              desktop/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig
              desktop/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/latest.json
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == matrix.target_filter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve desktop version
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${VERSION_INPUT:-}" ]]; then
            VERSION="${VERSION_INPUT}"
          fi

          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION (expected x.y.z)"
            exit 1
          fi

          if [[ -n "$VERSION" ]]; then
            echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Resolved DESKTOP_VERSION=$VERSION"
          else
            echo "DESKTOP_VERSION not provided, build scripts will use their default version strategy."
          fi

      - name: Build desktop bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          SKIP_TESTS: "true"
          SKIP_WEB_BUILD: "false"
          BUILD_TARGET_DMG: "true"
          TAURI_BUILD_CI: "true"
        run: ${{ matrix.run_script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
