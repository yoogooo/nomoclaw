name: release-desktop-macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build desktop bundles (app+dmg+updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TARGET_TRIPLE: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_TARGET_DMG: "true"
          SKIP_TESTS: "true"
          SKIP_WEB_BUILD: "false"
          TAURI_BUILD_CI: "true"
        run: ./scripts/build-desktop-macos.sh

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/latest.json
