spring:
  application:
    name: bot
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  mvc:
    async:
      request-timeout: -1
  profiles:
    default: local
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: false
    properties:
      "org.quartz.scheduler.instanceName": NomoClawScheduler
      "org.quartz.scheduler.instanceId": AUTO
      "org.quartz.jobStore.isClustered": false
      "org.quartz.jobStore.misfireThreshold": 60000
      "org.quartz.threadPool.threadCount": 3
    # initialize-schema can be enabled with:
    # spring:
    #   sql:
    #     init:
    #       mode: always
    #       schema-locations: classpath:db/schema-mysql.sql

mybatis-plus:
  global-config:
    banner: false

server:
  address: 127.0.0.1
  tomcat:
    threads:
      min-spare: 2
      max: 20

agent:
  command:
    timeout-seconds: 60
  browser:
    step-timeout-seconds: 10
    click-timeout-seconds: 10
    mode: auto
    headless: true
    force-click-fallback-enabled: false
    shared-profile-enabled: true
    shared-profile-name: shared
    local-bridge:
      cdp-endpoint: "http://localhost:9222"
      local-bridge-domains:
        - "xiaohongshu.com"
        - "google.com"
        - "*.google.com"
      connect-timeout-ms: 10000
      fallback-to-managed: false
      consent-required: false
  retry:
    max-attempts: 2
  loop:
    max-rounds: 200
  approval:
    high-risk-enabled: true
  api:
    local-only-enabled: true
    chat-upload:
      max-file-size: 10MB
      max-request-size: 100MB
  web-search:
    endpoints:
      - "https://www.bing.com/search?q={query}&setlang=zh-Hans"

nomoclaw:
  root-dir: "${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}"
  cron:
    approval-timeout-seconds: 1800
    resume-interval-seconds: 3
    resume-batch-size: 100
  flyway:
    fail-on-migrate-error: false

llm:
  provider: dashscope
  timeout: 180s
  max-retries: 1
  debug:
    enabled: true
    file-path: "logs/llm-debug.jsonl"
    max-chars-per-field: 200000
    redact-enabled: true
    include-response-text: true
    max-file-size-bytes: 52428800
  codex:
    model-name: gpt-5.5
    instructions: "You are a task planner and execution assistant."
  ollama:
    base-url: "http://localhost:11434"
    model-name: qwen3:8b
  qwen:
    api-key: "${DASHSCOPE_API_KEY:}"
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model-name: qwen3.5-plus
  gemini:
    api-key: "${GEMINI_API_KEY:}"
    base-url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model-name: gemini-2.5-flash
  kimi:
    api-key: "${KIMI_API_KEY:}"
    base-url: "https://api.moonshot.cn/v1"
    model-name: kimi-latest
  minimax:
    api-key: "${MINIMAX_API_KEY:}"
    base-url: "https://api.minimaxi.com/v1"
    model-name: MiniMax-M2.7
  model-config:
    encryption-key: "${LLM_MODEL_CONFIG_ENCRYPTION_KEY:}"
  model-catalog:
    remote-url: "${LLM_MODEL_CATALOG_REMOTE_URL:}"

logging:
  level:
    "ai.nomoclaw.bot": INFO
