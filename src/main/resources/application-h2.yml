spring:
  datasource:
    url: "jdbc:h2:file:${NOMOCLAW_ROOT_DIR:${user.home}/.nomoclaw}/data/nomoclaw;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=${nomoclaw.h2.auto-server:${NOMOCLAW_H2_AUTO_SERVER:FALSE}}"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/h2
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
